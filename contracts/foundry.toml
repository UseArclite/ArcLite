[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = true                     # required by the Poseidon2 differential test
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
rhc_mainnet = "https://rpc.mainnet.chain.robinhood.com"
rhc_testnet = "https://rpc.testnet.chain.robinhood.com"
